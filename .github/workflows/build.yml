name: Build and test
on: [pull_request]
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
            msvc_arch: x64
          - os: ubuntu-24.04-arm
            arch: armv8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - run: python -m pip install -r requirements.txt ninja
      - run: conan profile detect --force
      - run: conan install . --build=missing -s arch=${{ matrix.arch }} -s build_type=Release -s compiler.cppstd=20
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error

  docker:
    name: Docker / hardened Alpine
    runs-on: ubuntu-latest
    env:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hardened Images
        if: env.DHI_USERNAME != '' && env.DHI_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ env.DHI_TOKEN }}
      - name: Build image and run unit tests
        run: docker build --pull --tag movie-theater-booking:ci .
      - name: Run application in runtime image
        run: docker run --rm movie-theater-booking:ci
