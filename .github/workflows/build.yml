name: Build and test
on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
            msvc_arch: x64
          - os: ubuntu-24.04-arm
            arch: armv8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - run: python -m pip install -r requirements.txt ninja
      - run: conan profile detect --force
      - run: conan install . --build=missing -s arch=${{ matrix.arch }} -s build_type=Release -s compiler.cppstd=20 -o "*:shared=False"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Stage release binaries
        if: github.event_name == 'release'
        run: cmake --install build --prefix package
      - name: Run staged executable
        if: github.event_name == 'release'
        run: ./package/bin/movie-theater-booking
      - name: Package release binaries
        if: github.event_name == 'release'
        run: python .github/scripts/package_release.py --platform ${{ runner.os }} --arch ${{ matrix.arch }}
      - name: Upload release archives
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker / hardened Alpine
    runs-on: ubuntu-latest
    env:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hardened Images
        if: env.DHI_USERNAME != '' && env.DHI_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ env.DHI_USERNAME }}
          password: ${{ env.DHI_TOKEN }}
      - name: Build image and run unit tests
        run: docker build --pull --tag movie-theater-booking:ci .
      - name: Run application in runtime image
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1::8080 movie-theater-booking:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          host_port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "$container_id")
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 "http://127.0.0.1:${host_port}/movies"
          curl --fail "http://127.0.0.1:${host_port}/openapi.json"
      - name: Save tested image for publication
        if: github.event_name == 'release'
        run: docker save movie-theater-booking:ci | gzip > docker-image.tar.gz
      - name: Upload tested image
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release artifacts
    if: github.event_name == 'release'
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/movie-theater-booking', secrets.DHI_USERNAME) }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Publish tested image to Docker Hub
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load --input image/docker-image.tar.gz
          while IFS= read -r image_tag; do
            docker tag movie-theater-booking:ci "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"
      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
